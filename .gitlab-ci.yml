workflow:
    name: Solar System Pipeline for NodeJs
    rules:
        - if: $CI_COMMIT_BRANCH == 'main' || $CI_COMMIT_BRANCH =~ /^feature/
          when: always
        - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^feature/ && $CI_PIPELINE_SOURCE == 'merge_request_event'
          when: always

stages:
  - test
  - containerization

variables:
#   MONGO_URI: 'mongodb+srv://irfu6288_db_user:$M_DB_PASSWORD@supercluster.4plmtfj.mongodb.net/?appName=supercluster'
#   MONGO_USERNAME: irfu6288_db_user
#   MONGO_PASSWORD: $M_DB_PASSWORD
    DOCKER_USERNAME: siddharth67
    IMAGE_VERSION: $CI_PIPELINE_ID

unit_testing:
    stage: test
    image: node:17-alpine
    services:
      - name: siddharth67/mongo-db:non-prod
        alias: mongo
        pull_policy: always
    variables:
      MONGO_URI: 'mongodb://mongo:27017/superData'
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password
    cache:
      policy: pull-push
      when: on_success
      paths:
        - node_modules
      key:
        files:
          - package-lock.json
        prefix: node_modules
    before_script:
        - npm install
    script:
        - npm test
    artifacts:
      when: always
      expire_in: 3 days
      name: Moca-Test-Results
      paths:
        - test-results.xml
      reports:
        junit: test-results.xml

code_coverage:
    stage: test
    image: node:17-alpine
    services:
      - name: siddharth67/mongo-db:non-prod
        alias: mongo
        pull_policy: always
    variables:
      MONGO_URI: 'mongodb://mongo:27017/superData'
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password
    cache:
      policy: pull-push
      when: on_success
      paths:
        - node_modules
      key:
        files:
          - package-lock.json
        prefix: node_modules
    before_script:
        - npm install
    script:
        - npm run coverage
    artifacts:
      name: Code-Coverage-Results
      when: always
      expire_in: 3 days
      reports:
        coverage_report:
          coverage_format: cobertura
          path: coverage/cobertura-coverage.xml
    coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
    allow_failure: true

docker_build:
  stage: containerization
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  dependencies: []
  script:
    - docker build -t $DOCKER_USERNAME/solar-system:$IMAGE_VERSION .
    - docker images $DOCKER_USERNAME/solar-system:$IMAGE_VERSION
    - mkdir image
    - docker save $DOCKER_USERNAME/solar-system:$IMAGE_VERSION > image/solar-system-image-$IMAGE_VERSION.tar
  artifacts:
    paths:
      - image
    when: on_success
    access: all
    expire_in: 3 days

docker_test:
  stage: containerization
  image: docker:24.0.5
  needs:
    - docker_build
  services:
    - docker:24.0.5-dind
  dependencies: []
  script:
    - docker load -i image/solar-system-image-$IMAGE_VERSION.tar
    - docker run --name solar-system-app -d -p 3000:3000 $DOCKER_USERNAME/solar-system:$IMAGE_VERSION
    - export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
    - echo $IP
    - docker run alpine wget -q -O - http://$IP:3000/live | grep live