workflow:
    name: Solar System Pipeline with NodeJs
    rules:
        - if: $CI_COMMIT_BRANCH == 'main' || $CI_COMMIT_BRANCH =~ /^feature/
          when: always
        - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^feature/ && $CI_PIPELINE_SOURCE == 'merge_request_event'
          when: always

stages:
  - test

variables:
  MONGO_URI: 'mongodb+srv://irfu6288_db_user:$M_DB_PASSWORD@supercluster.4plmtfj.mongodb.net/?appName=supercluster'
  MONGO_USERNAME: irfu6288_db_user
  MONGO_PASSWORD: $M_DB_PASSWORD

unit_testing:
    stage: test
    image: node:17-alpine
    before_script:
        - npm install
    script:
        - npm test
    artifacts:
      when: always
      expire_in: 3 days
      name: Moca-Test-Results
      paths:
        - test-results.xml
      reports:
        junit: test-results.xml

code_coverage:
    stage: test
    image: node:17-alpine
    before_script:
        - npm install
    script:
        - npm run coverage
    artifacts:
      name: Code-Coverage-Results
      when: always
      expire_in: 3 days
      reports:
        coverage_report:
          coverage_format: cobertura
          path: coverage/cobertura-coverage.xml
    coverage: '/All files[^|]*|[^|]*\s+([\d\.]+)/'

sample_job:
  stage: test
  needs:
    - code_coverage
  image: node:17-alpine
  script:
    - echo "This is a sample Job..!!"
    