workflow:
    name: Solar System Pipeline with  NodeJs
    rules:
        - if: $CI_COMMIT_BRANCH == 'main' || $CI_COMMIT_BRANCH =~ /^feature/
          when: always
        - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^feature/ && $CI_PIPELINE_SOURCE == 'merge_request_event'
          when: always

stages:
  - test
  - containerization
  - dev_deploy
  - stage_deploy

variables:
    MONGO_URI: 'mongodb+srv://irfu6288_db_user:$M_DB_PASSWORD@supercluster.4plmtfj.mongodb.net/?appName=supercluster'
    MONGO_USERNAME: irfu6288_db_user
    MONGO_PASSWORD: $M_DB_PASSWORD
    DOCKER_USERNAME: irfanlab
    IMAGE_VERSION: $CI_PIPELINE_ID
    K8S_IMAGE: $DOCKER_USERNAME/solar-system:$IMAGE_VERSION

.prepare_nodejs_environment:
    image: node:17-alpine
    services:
      - name: siddharth67/mongo-db:non-prod
        alias: mongo
        pull_policy: always
    variables:
      MONGO_URI: 'mongodb://mongo:27017/superData'
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password
    cache:
      policy: pull-push
      when: on_success
      paths:
        - node_modules
      key:
        files:
          - package-lock.json
        prefix: node_modules
    before_script:
        - npm install

.prepare_deploy_environment: &kubernetes_deploy_job
  tags:
    - mac-local
  image: alpine:3.24.1
  dependencies: []

