unit_testing:
    stage: test
    image: node:17-alpine
    services:
      - name: siddharth67/mongo-db:non-prod
        alias: mongo
        pull_policy: always
    variables:
      MONGO_URI: 'mongodb://mongo:27017/superData'
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password
    cache:
      policy: pull-push
      when: on_success
      paths:
        - node_modules
      key:
        files:
          - package-lock.json
        prefix: node_modules
    before_script:
        - npm install
    script:
        - npm test
    artifacts:
      when: always
      expire_in: 3 days
      name: Moca-Test-Results
      paths:
        - test-results.xml
      reports:
        junit: test-results.xml

code_coverage:
    stage: test
    image: node:17-alpine
    services:
      - name: siddharth67/mongo-db:non-prod
        alias: mongo
        pull_policy: always
    variables:
      MONGO_URI: 'mongodb://mongo:27017/superData'
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password
    cache:
      policy: pull-push
      when: on_success
      paths:
        - node_modules
      key:
        files:
          - package-lock.json
        prefix: node_modules
    before_script:
        - npm install
    script:
        - npm run coverage
    artifacts:
      name: Code-Coverage-Results
      when: always
      expire_in: 3 days
      reports:
        coverage_report:
          coverage_format: cobertura
          path: coverage/cobertura-coverage.xml
    coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
    allow_failure: true

    